<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポモドーロタイマー</title>
  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-start: #4a90d9;   /* 青 */
      --color-mid:   #f5c518;   /* 黄 */
      --color-end:   #e84040;   /* 赤 */
      --bg-dark:     #0d1117;
      --text-main:   #e6edf3;
      --radius:      160px;
      --stroke:      12px;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ===== パーティクル Canvas ===== */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #particles.active { opacity: 1; }

    /* ===== メインコンテナ ===== */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .7;
    }

    /* ===== モードバッジ ===== */
    #mode-badge {
      font-size: .85rem;
      letter-spacing: .12em;
      padding: 4px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      transition: background .5s, border-color .5s;
    }

    /* ===== 円形プログレスバー ===== */
    .timer-ring {
      position: relative;
      width: calc(var(--radius) * 2 + 40px);
      height: calc(var(--radius) * 2 + 40px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    /* 背景トラック */
    .ring-track {
      fill: none;
      stroke: rgba(255,255,255,.08);
      stroke-width: var(--stroke);
    }

    /* 進捗弧 */
    #ring-progress {
      fill: none;
      stroke: var(--color-start);
      stroke-width: var(--stroke);
      stroke-linecap: round;
      transition: stroke-dashoffset .8s linear, stroke .8s ease;
      filter: drop-shadow(0 0 8px currentColor);
    }

    /* 時刻テキスト */
    .timer-display {
      text-align: center;
      line-height: 1;
    }
    #timer-text {
      font-size: 4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      transition: color .8s ease;
    }
    .session-label {
      font-size: .8rem;
      opacity: .5;
      margin-top: 8px;
      letter-spacing: .1em;
    }

    /* ===== コントロールボタン ===== */
    .controls {
      display: flex;
      gap: 16px;
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s;
      letter-spacing: .05em;
    }
    .btn:active { transform: scale(.96); }

    #btn-start {
      background: var(--color-start);
      color: #fff;
      box-shadow: 0 4px 20px rgba(74,144,217,.4);
      transition: background .8s ease, box-shadow .8s ease, transform .1s;
    }
    #btn-reset {
      background: rgba(255,255,255,.08);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,.15);
    }
    #btn-reset:hover { background: rgba(255,255,255,.14); }

    /* ===== セッションカウンター ===== */
    .sessions {
      display: flex;
      gap: 8px;
    }
    .session-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      transition: background .4s, transform .3s;
    }
    .session-dot.done {
      background: var(--color-start);
      transform: scale(1.2);
    }

    /* ===== 波紋エフェクト ===== */
    .ripple-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple-anim 4s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(6); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- パーティクル Canvas -->
<canvas id="particles"></canvas>

<!-- 波紋コンテナ -->
<div class="ripple-container" id="ripple-container"></div>

<div class="container">
  <h1>ポモドーロタイマー</h1>

  <div id="mode-badge">集中モード</div>

  <!-- 円形プログレスバー -->
  <div class="timer-ring">
    <svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
      <circle class="ring-track" cx="180" cy="180" r="160" />
      <circle id="ring-progress" cx="180" cy="180" r="160" />
    </svg>
    <div class="timer-display">
      <div id="timer-text">25:00</div>
      <div class="session-label" id="session-label">セッション 1 / 4</div>
    </div>
  </div>

  <!-- コントロール -->
  <div class="controls">
    <button class="btn" id="btn-start">▶ スタート</button>
    <button class="btn" id="btn-reset">↺ リセット</button>
  </div>

  <!-- セッションドット -->
  <div class="sessions" id="session-dots">
    <div class="session-dot" data-idx="0"></div>
    <div class="session-dot" data-idx="1"></div>
    <div class="session-dot" data-idx="2"></div>
    <div class="session-dot" data-idx="3"></div>
  </div>
</div>

<script>
// ===== 設定 =====
const WORK_SEC     = 25 * 60;
const BREAK_SEC    = 5  * 60;
const LONG_BREAK   = 15 * 60;
const SESSIONS_MAX = 4;

// ===== パーティクル設定 =====
const PARTICLE_BOTTOM_OFFSET    = 10;
const PARTICLES_PER_FRAME       = 3;
const PARTICLE_MAX_H_SPEED      = 1.2;
const PARTICLE_MAX_V_SPEED      = 1.5;
const PARTICLE_MIN_V_SPEED      = 0.5;
const PARTICLE_MAX_SIZE_RANGE   = 3;
const PARTICLE_MIN_SIZE         = 1;
const PARTICLE_MAX_DECAY_RANGE  = 0.004;
const PARTICLE_MIN_DECAY        = 0.002;
const PARTICLE_HUE_BASE         = 180;
const PARTICLE_HUE_RANGE        = 60;
const PARTICLE_SATURATION       = 80;
const PARTICLE_LIGHTNESS        = 65;
const PARTICLE_OPACITY_MULT     = 0.6;

// ===== 波紋設定 =====
const RIPPLE_MIN_SIZE       = 60;
const RIPPLE_SIZE_RANGE     = 100;
const RIPPLE_HUE_BASE       = 180;
const RIPPLE_HUE_RANGE      = 60;
const RIPPLE_MIN_DURATION   = 3;
const RIPPLE_DURATION_RANGE = 2;
const RIPPLE_SPAWN_INTERVAL = 1800;

// ===== 状態 =====
let totalSec          = WORK_SEC;
let remaining         = WORK_SEC;
let running           = false;
let isWork            = true;
let session           = 1;   // 1-4
let completedSessions = 0;   // 完了した作業セッション数
let intervalId        = null;

// ===== DOM =====
const timerText  = document.getElementById('timer-text');
const ringProg   = document.getElementById('ring-progress');
const btnStart   = document.getElementById('btn-start');
const btnReset   = document.getElementById('btn-reset');
const modeBadge  = document.getElementById('mode-badge');
const sessionLbl = document.getElementById('session-label');
const dots       = document.querySelectorAll('.session-dot');
const particleCV = document.getElementById('particles');
const rippleCont = document.getElementById('ripple-container');

// ===== SVG プログレス初期化 =====
const R           = 160;
const CIRCUMF     = 2 * Math.PI * R;
ringProg.style.strokeDasharray  = CIRCUMF;
ringProg.style.strokeDashoffset = 0;

// ===== ユーティリティ =====
function fmt(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

// 青 → 黄 → 赤 を progress (0=開始,1=終了) で補間
function progressColor(progress) {
  let r, g, b;
  if (progress < 0.5) {
    const t = progress / 0.5;
    r = Math.round(74  + t * (245 - 74));   // 74 → 245
    g = Math.round(144 + t * (197 - 144));  // 144 → 197
    b = Math.round(217 + t * (24  - 217));  // 217 → 24
  } else {
    const t = (progress - 0.5) / 0.5;
    r = Math.round(245 + t * (232 - 245));  // 245 → 232
    g = Math.round(197 + t * (64  - 197));  // 197 → 64
    b = Math.round(24  + t * (64  - 24));   // 24  → 64
  }
  return `rgb(${r},${g},${b})`;
}

function updateRing() {
  const progress  = 1 - remaining / totalSec;   // 0(開始) → 1(終了)
  const offset    = CIRCUMF * (1 - remaining / totalSec);
  ringProg.style.strokeDashoffset = offset;

  if (isWork) {
    const color = progressColor(progress);
    ringProg.style.stroke = color;
    timerText.style.color = color;
    btnStart.style.background  = color;
    btnStart.style.boxShadow   = `0 4px 20px ${color}66`;
  } else {
    const green = '#34c77b';
    ringProg.style.stroke = green;
    timerText.style.color = green;
    btnStart.style.background  = green;
    btnStart.style.boxShadow   = '0 4px 20px rgba(52,199,123,.4)';
  }
}

function updateSessionDots() {
  dots.forEach((d, i) => {
    d.classList.toggle('done', i < completedSessions);
  });
  sessionLbl.textContent = `セッション ${session} / ${SESSIONS_MAX}`;
}

// ===== タイマーロジック =====
function tick() {
  if (remaining <= 0) {
    clearInterval(intervalId);
    running = false;
    btnStart.textContent = '▶ スタート';
    handlePhaseEnd();
    return;
  }
  remaining--;
  timerText.textContent = fmt(remaining);
  updateRing();
}

function handlePhaseEnd() {
  if (isWork) {
    // 作業終了 → 休憩へ
    completedSessions++;
    const isLongBreak = completedSessions % SESSIONS_MAX === 0;
    isWork    = false;
    totalSec  = isLongBreak ? LONG_BREAK : BREAK_SEC;
    remaining = totalSec;
    modeBadge.textContent = isLongBreak ? '長い休憩' : '休憩中';
    if (isLongBreak) {
      // 長い休憩後はセッションとドットをリセット
      completedSessions = 0;
      session = 1;
    }
    stopParticles();
  } else {
    // 休憩終了 → 次の作業へ
    if (session < SESSIONS_MAX) session++;
    isWork    = true;
    totalSec  = WORK_SEC;
    remaining = WORK_SEC;
    modeBadge.textContent = '集中モード';
  }
  updateSessionDots();
  timerText.textContent = fmt(remaining);
  updateRing();
  autoStart();
}

function autoStart() {
  intervalId = setInterval(tick, 1000);
  running    = true;
  btnStart.textContent = '⏸ 一時停止';
  if (isWork) startParticles();
}

function startTimer() {
  if (running) {
    clearInterval(intervalId);
    running = false;
    btnStart.textContent = '▶ スタート';
    stopParticles();
  } else {
    intervalId = setInterval(tick, 1000);
    running    = true;
    btnStart.textContent = '⏸ 一時停止';
    if (isWork) startParticles();
  }
}

function resetTimer() {
  clearInterval(intervalId);
  running           = false;
  isWork            = true;
  session           = 1;
  completedSessions = 0;
  totalSec   = WORK_SEC;
  remaining  = WORK_SEC;
  modeBadge.textContent = '集中モード';
  btnStart.textContent  = '▶ スタート';
  timerText.textContent = fmt(remaining);
  timerText.style.color = getComputedStyle(document.documentElement).getPropertyValue('--color-start').trim();
  updateRing();
  updateSessionDots();
  stopParticles();
}

btnStart.addEventListener('click', startTimer);
btnReset.addEventListener('click', resetTimer);

// ===== パーティクルシステム =====
const ctx = particleCV.getContext('2d');
let particles = [];
let animFrame = null;
let particleActive = false;

function resizeCanvas() {
  particleCV.width  = window.innerWidth;
  particleCV.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createParticle() {
  return {
    x:     Math.random() * particleCV.width,
    y:     particleCV.height - PARTICLE_BOTTOM_OFFSET,
    vx:    (Math.random() - 0.5) * PARTICLE_MAX_H_SPEED,
    vy:    -(Math.random() * PARTICLE_MAX_V_SPEED + PARTICLE_MIN_V_SPEED),
    size:  Math.random() * PARTICLE_MAX_SIZE_RANGE + PARTICLE_MIN_SIZE,
    life:  1.0,
    decay: Math.random() * PARTICLE_MAX_DECAY_RANGE + PARTICLE_MIN_DECAY,
    hue:   Math.random() * PARTICLE_HUE_RANGE + PARTICLE_HUE_BASE,
  };
}

function animateParticles() {
  ctx.clearRect(0, 0, particleCV.width, particleCV.height);

  // 新しいパーティクルを追加
  if (particleActive) {
    for (let i = 0; i < PARTICLES_PER_FRAME; i++) particles.push(createParticle());
  }

  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x   += p.vx;
    p.y   += p.vy;
    p.life -= p.decay;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, ${PARTICLE_SATURATION}%, ${PARTICLE_LIGHTNESS}%, ${p.life * PARTICLE_OPACITY_MULT})`;
    ctx.fill();
  });

  animFrame = requestAnimationFrame(animateParticles);
}

function startParticles() {
  particleActive = true;
  particleCV.classList.add('active');
  if (!animFrame) animateParticles();
}

function stopParticles() {
  particleActive = false;
  particleCV.classList.remove('active');
  // 残パーティクルが消えたらループ停止
  const waitForEmpty = () => {
    if (particles.length === 0) {
      cancelAnimationFrame(animFrame);
      animFrame = null;
    } else {
      requestAnimationFrame(waitForEmpty);
    }
  };
  requestAnimationFrame(waitForEmpty);
}

// ===== 波紋エフェクト =====
function spawnRipple() {
  if (!isWork || !running) return;

  const ripple = document.createElement('div');
  ripple.className = 'ripple';

  const size = Math.random() * RIPPLE_SIZE_RANGE + RIPPLE_MIN_SIZE;
  const x    = Math.random() * window.innerWidth;
  const y    = Math.random() * window.innerHeight;
  const hue  = Math.random() * RIPPLE_HUE_RANGE + RIPPLE_HUE_BASE;
  const dur  = Math.random() * RIPPLE_DURATION_RANGE + RIPPLE_MIN_DURATION;

  ripple.style.cssText = `
    width: ${size}px; height: ${size}px;
    left: ${x - size / 2}px; top: ${y - size / 2}px;
    border: 1.5px solid hsla(${hue}, 70%, 60%, .35);
    background: hsla(${hue}, 70%, 60%, .05);
    animation-duration: ${dur}s;
  `;

  rippleCont.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

setInterval(spawnRipple, RIPPLE_SPAWN_INTERVAL);

// ===== 初期描画 =====
updateRing();
updateSessionDots();
</script>
</body>
</html>
